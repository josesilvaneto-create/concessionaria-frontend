
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veículos - Concessionária</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/photo-upload.js"></script>
    <script src="js/veiculos.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <h1 class="nav-logo">Concessionária</h1>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="veiculos.html" class="nav-link active">Veículos</a>
                    </li>
                    <li class="nav-item">
                        <a href="cadastro-veiculo.html" class="nav-link">Cadastrar Veículo</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" onclick="logout()">Sair</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>Nossa Frota</h1>
                <p>Confira nossos veículos disponíveis</p>
            </div>

            <!-- Container onde os veículos serão carregados -->
            <div id="veiculos-container">
                <div class="loading">
                    <p>Carregando veículos...</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Concessionária. Todos os direitos reservados.</p>
        </div>
    </footer>

    <style>
        /* Estilos específicos para a página de veículos */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #666;
            font-size: 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Layout responsivo para os cards */
        @media (min-width: 768px) {
            #veiculos-container {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
                gap: 20px;
            }
        }
    </style>

    <script>
        // Função de logout
        function logout() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_id');
            sessionStorage.removeItem('auth_token');
            sessionStorage.removeItem('user_id');
            window.location.href = 'login.html';
        }

        // Verificar autenticação ao carregar a página
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
        });
    </script>
</body>
</html>
